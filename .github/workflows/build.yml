name: Windows extractor build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            make
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-llvm-tools
            zip

      - name: Build pkg_extractor
        run: bash build/wconf

      - name: Test pkg_extractor
        run: ctest --test-dir extractor/build --output-on-failure

      - name: Package Windows extractor
        run: bash extractor/build/wpack
